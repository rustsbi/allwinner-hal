[[bin]]
name = "uart-demo"
test = false
bench = false

[[bin]]
name = "usb-storage"
test = false
bench = false

[[bin]]
name = "usb-network"
test = false
bench = false

[[bin]]
name = "usb-composite"
test = false
bench = false
